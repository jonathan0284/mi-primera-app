<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Primera App</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div id="app">
      <div class="hero">
        <div class="badge">🚀 Bienvenido</div>
        <h1>Mi Primera <span>App</span></h1>
        <p>Una aplicación creada con HTML, JavaScript y Vite</p>
        <div class="botones">
          <button id="btn-empezar">Empezar</button>
          <button id="btn-info" class="secundario">Saber más</button>
        </div>
        <div id="mensaje-bienvenida" class="mensaje"></div>
      </div>

      <div class="cards">
        <div class="card">
          <div class="card-icono">⚡</div>
          <h3>Rápido</h3>
          <p>Construido con Vite para un desarrollo ágil</p>
        </div>
        <div class="card">
          <div class="card-icono">🎯</div>
          <h3>Simple</h3>
          <p>HTML y JavaScript puro, sin frameworks</p>
        </div>
        <div class="card">
          <div class="card-icono">🌐</div>
          <h3>Publicable</h3>
          <p>Listo para subir a Netlify o GitHub Pages</p>
        </div>
      </div>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
